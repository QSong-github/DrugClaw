[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drugclaw"
version = "0.1.0"
description = "Agentic system with Synaptic Navigation for Evidence-based Drug Reasoning"
authors = [{name = "Qing Wang"}]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
